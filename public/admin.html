<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | QR Menu Quick</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/admin.css">
</head>

<body>
    <!-- Login Screen -->
    <div class="login-screen" id="loginScreen">
        <div class="login-card">
            <div class="login-logo">🍽️</div>
            <h1 class="login-title">QR Menu Quick</h1>
            <p class="login-subtitle">Admin Dashboard</p>
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="loginUsername" placeholder="Enter username" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter password" required>
                </div>
                <div class="login-error" id="loginError"></div>
                <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="dashboard" id="dashboard" style="display:none;">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">🍽️</span>
                <span class="sidebar-title">Admin</span>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" data-tab="categories" onclick="switchTab('categories')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="7" height="7" />
                        <rect x="14" y="3" width="7" height="7" />
                        <rect x="3" y="14" width="7" height="7" />
                        <rect x="14" y="14" width="7" height="7" />
                    </svg>
                    Categories
                </button>
                <button class="nav-item" data-tab="menu-items" onclick="switchTab('menu-items')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                    Menu Items
                </button>
                <button class="nav-item" data-tab="orders" onclick="switchTab('orders')">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" />
                        <line x1="3" y1="6" x2="21" y2="6" />
                        <path d="M16 10a4 4 0 0 1-8 0" />
                    </svg>
                    Orders
                </button>
            </nav>
            <div class="sidebar-footer">
                <button class="nav-item logout" onclick="handleLogout()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                        <polyline points="16 17 21 12 16 7" />
                        <line x1="21" y1="12" x2="9" y2="12" />
                    </svg>
                    Logout
                </button>
            </div>
        </aside>

        <!-- Mobile Header -->
        <div class="mobile-header" id="mobileHeader">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <span class="mobile-title">Admin Panel</span>
            <button class="mobile-logout" onclick="handleLogout()">Logout</button>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Categories Tab -->
            <div class="tab-content active" id="tab-categories">
                <div class="content-header">
                    <h2>Categories</h2>
                    <button class="btn btn-primary" onclick="openCategoryModal()">+ Add Category</button>
                </div>
                <div class="table-container">
                    <table class="data-table" id="categoriesTable">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Items</th>
                                <th>Order</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="categoriesBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Menu Items Tab -->
            <div class="tab-content" id="tab-menu-items">
                <div class="content-header">
                    <h2>Menu Items</h2>
                    <button class="btn btn-primary" onclick="openMenuItemModal()">+ Add Item</button>
                </div>
                <div class="table-container">
                    <table class="data-table" id="menuItemsTable">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Type</th>
                                <th>Available</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="menuItemsBody"></tbody>
                    </table>
                </div>
            </div>

            <!-- Orders Tab -->
            <div class="tab-content" id="tab-orders">
                <div class="content-header">
                    <h2>Orders</h2>
                    <button class="btn btn-secondary" onclick="loadOrders()">↻ Refresh</button>
                </div>
                <div class="table-container">
                    <table class="data-table" id="ordersTable">
                        <thead>
                            <tr>
                                <th>Order #</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="ordersBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Category Modal -->
    <div class="modal-overlay" id="categoryModal" onclick="closeCategoryModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="categoryModalTitle">Add Category</h3>
                <button class="modal-close" onclick="closeCategoryModal()">✕</button>
            </div>
            <form id="categoryForm" onsubmit="handleCategorySubmit(event)">
                <input type="hidden" id="categoryId">
                <div class="form-group">
                    <label>Category Name *</label>
                    <input type="text" id="categoryName" placeholder="e.g., Burgers" required>
                </div>
                <div class="form-group">
                    <label>Sort Order</label>
                    <input type="number" id="categorySortOrder" placeholder="0" value="0">
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <input type="file" id="categoryImage" accept="image/*">
                    <div class="image-preview" id="categoryImagePreview"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeCategoryModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="categorySubmitBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Menu Item Modal -->
    <div class="modal-overlay" id="menuItemModal" onclick="closeMenuItemModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="menuItemModalTitle">Add Menu Item</h3>
                <button class="modal-close" onclick="closeMenuItemModal()">✕</button>
            </div>
            <form id="menuItemForm" onsubmit="handleMenuItemSubmit(event)">
                <input type="hidden" id="menuItemId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Item Name *</label>
                        <input type="text" id="menuItemName" placeholder="e.g., Chicken Burger" required>
                    </div>
                    <div class="form-group">
                        <label>Price (₹) *</label>
                        <input type="number" id="menuItemPrice" placeholder="199" step="0.01" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="menuItemDesc" rows="2" placeholder="Short description..."></textarea>
                </div>
                <div class="form-group">
                    <label>Category *</label>
                    <select id="menuItemCategory" required>
                        <option value="">Select category</option>
                    </select>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="menuItemIsVeg" checked> Vegetarian
                        </label>
                    </div>
                    <div class="form-group">
                        <label>
                            <input type="checkbox" id="menuItemIsAvailable" checked> Available
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>Image</label>
                    <input type="file" id="menuItemImage" accept="image/*">
                    <div class="image-preview" id="menuItemImagePreview"></div>
                </div>
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="closeMenuItemModal()">Cancel</button>
                    <button type="submit" class="btn btn-primary" id="menuItemSubmitBtn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/js/admin.js"></script>
</body>

</html>
