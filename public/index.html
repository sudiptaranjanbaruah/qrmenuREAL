<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Menu Quick | Restaurant Menu</title>
  <meta name="description" content="Browse our delicious menu and order via WhatsApp. Fresh food, quick service!">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>

<body>
  <!-- Header -->
  <header class="header" id="header">
    <div class="header-content">
      <div class="header-left">
        <div class="logo-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 2l2.5 5.5L8 2" />
            <path d="M13 2l2.5 5.5L18 2" />
            <path d="M3 7h18v2a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7V7z" />
            <path d="M12 16v5" />
            <path d="M8 21h8" />
          </svg>
        </div>
        <div class="header-text">
          <h1 class="restaurant-name">QR Menu Quick</h1>
          <p class="restaurant-tagline">Delicious food, one scan away</p>
        </div>
      </div>
      <button class="cart-btn" id="cartBtn" onclick="toggleCart()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1" />
          <circle cx="20" cy="21" r="1" />
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6" />
        </svg>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <!-- Search Bar -->
  <div class="search-section">
    <div class="search-container">
      <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <path d="m21 21-4.35-4.35" />
      </svg>
      <input type="text" class="search-input" id="searchInput" placeholder="Search for dishes..."
        oninput="handleSearch(this.value)">
      <button class="search-clear" id="searchClear" onclick="clearSearch()" style="display:none;">✕</button>
    </div>
  </div>

  <!-- Categories -->
  <section class="categories-section" id="categoriesSection">
    <h2 class="section-title">What are you craving?</h2>
    <div class="categories-scroll" id="categoriesContainer">
      <!-- Categories loaded dynamically -->
    </div>
  </section>

  <!-- Menu Items -->
  <section class="menu-section" id="menuSection">
    <div class="menu-header">
      <h2 class="section-title" id="menuTitle">Our Menu</h2>
      <div class="veg-filter">
        <button class="filter-btn active" data-filter="all" onclick="setVegFilter('all')">All</button>
        <button class="filter-btn" data-filter="veg" onclick="setVegFilter('veg')">
          <span class="veg-dot green"></span> Veg
        </button>
        <button class="filter-btn" data-filter="nonveg" onclick="setVegFilter('nonveg')">
          <span class="veg-dot red"></span> Non-Veg
        </button>
      </div>
    </div>
    <div class="menu-grid" id="menuGrid">
      <!-- Menu items loaded dynamically -->
    </div>
    <div class="no-results" id="noResults" style="display:none;">
      <p>No dishes found. Try a different search!</p>
    </div>
  </section>

  <!-- Cart Panel -->
  <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
  <div class="cart-panel" id="cartPanel">
    <div class="cart-header">
      <h2>Your Order</h2>
      <button class="cart-close" onclick="toggleCart()">✕</button>
    </div>
    <div class="cart-items" id="cartItems">
      <div class="cart-empty" id="cartEmpty">
        <p>Your cart is empty</p>
        <p class="cart-empty-sub">Add some delicious items!</p>
      </div>
    </div>
    <div class="cart-footer" id="cartFooter" style="display:none;">
      <div class="cart-total">
        <span>Total</span>
        <span id="cartTotal">₹0</span>
      </div>
      <div class="cart-customer">
        <input type="text" id="customerName" placeholder="Your Name" class="cart-input">
        <input type="tel" id="customerPhone" placeholder="Phone Number" class="cart-input">
      </div>
      <button class="order-btn" id="orderBtn" onclick="placeOrder()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z" />
          <path
            d="M12 0C5.373 0 0 5.373 0 12c0 2.128.556 4.124 1.528 5.858L0 24l6.335-1.486A11.942 11.942 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0zm0 22c-1.94 0-3.748-.564-5.274-1.528l-.378-.224-3.758.882.945-3.636-.247-.394A9.946 9.946 0 0 1 2 12C2 6.486 6.486 2 12 2s10 4.486 10 10-4.486 10-10 10z" />
        </svg>
        Order via WhatsApp
      </button>
    </div>
  </div>

  <!-- Loading Spinner -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <script src="/js/app.js"></script>
</body>

</html>
